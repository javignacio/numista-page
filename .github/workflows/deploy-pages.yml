name: Build and deploy Numista collection

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install generator dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore Numista API cache
        uses: actions/cache@v4
        with:
          path: |
            generator/type_cache
            generator/issuers_cache
          key: numista-api-cache-${{ runner.os }}-${{ hashFiles('generator/inputs/*.csv') }}
          restore-keys: |
            numista-api-cache-${{ runner.os }}-

      - name: Validate required Numista inputs
        run: |
          test -s generator/inputs/collection_public.csv
          test -s generator/inputs/wishlist_public.csv
          test -s generator/inputs/on_transit.csv
          test -s generator/inputs/wishlist_issuers.csv

      - name: Generate the collection page
        working-directory: generator
        env:
          NUMISTA_API_KEY: ${{ secrets.NUMISTA_API_KEY }}
        run: python numista_collection_v1_13.py

      - name: Validate generated files
        run: |
          test -s generator/out/collection_wishlist_analytics.html
          python -m json.tool generator/out/summary.json > /dev/null

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir _site
          cp generator/out/collection_wishlist_analytics.html _site/index.html
          cp generator/out/summary.json _site/summary.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
